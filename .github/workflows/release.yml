# Tag vX.Y.Z -> build and push images to GHCR with the tag and the commit sha.
# Deploy pulls by tag (MCPKG_IMAGE etc. in .env); never :latest in production.
# First time: make the three packages public in GitHub -> Packages, or `docker login ghcr.io` on the boxes.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: build and push
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          reg="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          tag="$(echo "$REF" | tr '/' '-')"
          short="${SHA::12}"
          docker buildx build --push --platform linux/amd64,linux/arm64 -f deploy/Dockerfile \
            -t "$reg/mcpkg:$tag" -t "$reg/mcpkg:sha-$short" .
          # runner + proxy must build for arm64 too: the core box is t4g (arm64) and
          # may run them when HEAVY_ON_CORE=1 (ISSUES #25).
          docker buildx build --push --platform linux/amd64,linux/arm64 -f sandbox/runner.Dockerfile \
            -t "$reg/mcpkg-runner:$tag" -t "$reg/mcpkg-runner:sha-$short" sandbox
          docker buildx build --push --platform linux/amd64,linux/arm64 -f sandbox/proxy.Dockerfile \
            -t "$reg/mcpkg-egress-proxy:$tag" -t "$reg/mcpkg-egress-proxy:sha-$short" sandbox
          {
            echo "### Images"
            echo '```'
            echo "MCPKG_IMAGE=$reg/mcpkg:$tag"
            echo "MCPKG_PROXY_IMAGE=$reg/mcpkg-egress-proxy:$tag"
            echo "SANDBOX_IMAGE=$reg/mcpkg-runner:$tag"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
