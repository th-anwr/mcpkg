name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Weekly: real-network end-to-end pipeline (installs real packages from npm/PyPI).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: unit tests
        run: go test ./...
      - name: db tests
        run: go test ./internal/e2e
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
      # Run directly: govulncheck-action re-runs setup-go and its cache restore collides with ours.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: gosec (sandbox, launch, web)
        uses: securego/gosec@v2.30.0
        with:
          args: "-severity=high -confidence=high ./internal/sandbox/... ./internal/launch/... ./internal/web/..."

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: app image (amd64 + arm64; the core box is arm64)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile .
      - name: sandbox runner image
        run: docker build -f sandbox/runner.Dockerfile -t mcpkg-runner:ci sandbox
      - name: egress proxy image
        run: docker build -f sandbox/proxy.Dockerfile -t mcpkg-egress-proxy:ci sandbox

  # Full pipeline against real npm/PyPI/GitHub, on a schedule or by hand.
  # Deliberately not on every push: real package installs are slow and flaky.
  e2e-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install uv (smoke tests install PyPI packages with uv)
        run: pip install uv
      - name: full pipeline (real npm/PyPI installs)
        run: go test ./internal/e2e -run TestFullPipeline -v -timeout 40m
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
          E2E_NETWORK: "1"

  # Tier-1 deploy gate (docs/BENCH_GATE.md): B0-B3 + B5 over a 12-tool
  # known-answer fixture. Writes bench/gate.json, uploaded as an artifact and
  # committed back to main, so deploy/aws/push.sh can require a green report
  # for the exact GATE_SHA it is pushing. The gate commit does not re-trigger
  # this job (message guard below).
  bench-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'gate:'))
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: run tier-1 gates (B0, B1, B2, B3, B5)
        run: go test ./internal/bench -run TestGate -v -count=1
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
          GATE_SHA: ${{ github.sha }}
      - name: upload gate report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-gate-report
          path: bench/gate.json
          if-no-files-found: ignore
      - name: commit gate report
        if: success()
        run: |
          git config user.name "mcpkg-gate"
          git config user.email "gate@mcpkg.invalid"
          git add bench/gate.json
          if git diff --cached --quiet; then
            echo "gate report unchanged"
            exit 0
          fi
          git commit -m "gate: bench/gate.json for ${{ github.sha }}"
          # main may have moved (other pushes landed while this job ran):
          # rebase on top and retry a few times instead of failing the gate.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "gate report push failed after retries" >&2
          exit 1
