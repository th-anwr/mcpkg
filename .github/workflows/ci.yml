name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: unit tests
        run: go test ./...
      - name: db tests
        run: go test ./internal/e2e
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
        continue-on-error: true

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: app image
        run: docker build -f deploy/Dockerfile -t mcpkg:ci .
      - name: sandbox runner image
        run: docker build -f sandbox/runner.Dockerfile -t mcpkg-runner:ci sandbox
      - name: egress proxy image
        run: docker build -f sandbox/proxy.Dockerfile -t mcpkg-egress-proxy:ci sandbox
