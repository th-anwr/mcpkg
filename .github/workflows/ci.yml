name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Weekly: real-network end-to-end pipeline (installs real packages from npm/PyPI).
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - name: unit tests
        run: go test ./...
      - name: db tests
        run: go test ./internal/e2e
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
      # Run directly: govulncheck-action re-runs setup-go and its cache restore collides with ours.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        continue-on-error: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: gosec (sandbox, launch, web)
        uses: securego/gosec@v2.30.0
        with:
          args: "-severity=high -confidence=high ./internal/sandbox/... ./internal/launch/... ./internal/web/..."

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: app image (amd64 + arm64; the core box is arm64)
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile .
      - name: sandbox runner image
        run: docker build -f sandbox/runner.Dockerfile -t mcpkg-runner:ci sandbox
      - name: egress proxy image
        run: docker build -f sandbox/proxy.Dockerfile -t mcpkg-egress-proxy:ci sandbox

  # Real installs in the Docker sandbox through the egress proxy, under plain
  # runc and under gVisor (the production runtime, SANDBOX_RUNTIME=runsc).
  # The only test of the sandbox network path: under gVisor a proxy given by
  # name does not resolve (issue N22). Not part of the deploy gate.
  sandbox-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build runner and proxy images
        run: |
          docker build -q -f sandbox/runner.Dockerfile -t mcpkg-runner:ci sandbox
          docker build -q -f sandbox/proxy.Dockerfile -t mcpkg-egress-proxy:ci sandbox
      - name: install gVisor (same packages as deploy/aws/bootstrap.sh)
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor --yes -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list >/dev/null
          sudo apt-get update -y -qq && sudo apt-get install -y -qq runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format 'docker {{.ServerVersion}}, runtimes: {{range $k, $v := .Runtimes}}{{$k}} {{end}}'
          runsc --version | head -1
      - name: start the egress proxy the way compose does (default + internal network)
        run: |
          docker network create --internal mcpkg-egress
          docker run -d --name mcpkg-egress-proxy-1 mcpkg-egress-proxy:ci
          docker network connect --alias egress-proxy mcpkg-egress mcpkg-egress-proxy-1
          sleep 3
          docker ps --format '{{.Names}} {{.Status}}'
      - name: sandbox installs under runc
        run: go test ./internal/sandbox -run TestDockerInstallThroughProxy -v -count=1 -timeout 10m
        env:
          SANDBOX_DOCKER_TEST: "1"
          SANDBOX_IMAGE: mcpkg-runner:ci
      - name: sandbox installs under gVisor
        run: go test ./internal/sandbox -run TestDockerInstallThroughProxy -v -count=1 -timeout 10m
        env:
          SANDBOX_DOCKER_TEST: "1"
          SANDBOX_IMAGE: mcpkg-runner:ci
          SANDBOX_RUNTIME: runsc
      - name: proxy log
        if: always()
        run: docker exec mcpkg-egress-proxy-1 sh -c 'tail -n 20 /var/log/squid/access.log' || docker logs --tail 30 mcpkg-egress-proxy-1

  # Full pipeline against real npm/PyPI/GitHub, on a schedule or by hand.
  # Deliberately not on every push: real package installs are slow and flaky.
  e2e-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Ubuntu 24.04's system pip refuses installs (PEP 668), so use pipx.
      - name: install uv (smoke tests install PyPI packages with uv)
        run: |
          pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: full pipeline (real npm/PyPI installs)
        run: go test ./internal/e2e -run TestFullPipeline -v -timeout 40m
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
          E2E_NETWORK: "1"

  # Tier-1 benchmark gate (docs/BENCH_GATE.md): B0-B3 + B5 over a 12-tool
  # known-answer fixture. deploy/aws/push.sh deploys a commit only when this
  # job, go and docker passed for it here (read from the check-runs API), so
  # nothing is committed back to main. The report is kept as an artifact.
  bench-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcpkg
          POSTGRES_PASSWORD: mcpkg
          POSTGRES_DB: mcpkg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpkg -d mcpkg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: run tier-1 gates (B0, B1, B2, B3, B5)
        run: go test ./internal/bench -run TestGate -v -count=1
        env:
          TEST_DATABASE_URL: postgres://mcpkg:mcpkg@localhost:5432/mcpkg_test?sslmode=disable
          GATE_SHA: ${{ github.sha }}
      - name: upload gate report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-gate-report
          path: bench/gate.json
          if-no-files-found: ignore
