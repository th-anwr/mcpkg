# Extra static rules used when `semgrep` is installed on the worker (optional).
# Findings are review leads, not verdicts. Keep rules precise to avoid noise.
rules:
  - id: js-shell-exec-with-template
    languages: [javascript, typescript]
    severity: WARNING
    message: Shell command built from a template string; check that tool arguments cannot inject commands.
    pattern-either:
      - pattern: require("child_process").exec(`...${$X}...`, ...)
      - pattern: $CP.exec(`...${$X}...`, ...)
      - pattern: $CP.execSync(`...${$X}...`, ...)

  - id: py-shell-true
    languages: [python]
    severity: WARNING
    message: subprocess with shell=True; check that tool arguments are not interpolated into the command.
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: os.system(...)

  - id: js-eval-dynamic
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic code execution.
    pattern-either:
      - pattern: eval($X)
      - pattern: new Function(...)

  - id: py-exec-dynamic
    languages: [python]
    severity: ERROR
    message: Dynamic code execution.
    pattern-either:
      - pattern: exec($X)
      - pattern: eval($X)

  - id: home-credential-read
    languages: [javascript, typescript, python]
    severity: ERROR
    message: Reads files from credential locations in the user's home directory.
    pattern-regex: (\.ssh/|\.aws/credentials|\.npmrc|\.pypirc|\.git-credentials|\.docker/config\.json)

  - id: tls-verification-disabled
    languages: [javascript, typescript, python]
    severity: WARNING
    message: TLS certificate verification disabled.
    pattern-either:
      - pattern-regex: rejectUnauthorized\s*:\s*false
      - pattern-regex: NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*["']?0
      - pattern: requests.$M(..., verify=False, ...)
